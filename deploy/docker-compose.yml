services:
  app:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      BAGKEEPER_ENV: production
      BAGKEEPER_DATA_DIR: /data
    volumes:
      - ./data:/data          # database + photos live here on the VM disk
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app
volumes:
  caddy_data:
